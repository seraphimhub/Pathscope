name: "Pathscope CI"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pytest pytest-asyncio pytest-cov ruff mypy bandit pyyaml hypothesis

      - name: Validate imports
        run: |
          python -c "import cli"
          python -c "import core"
          python -c "import crawler"
          python -c "import scanners"

      - name: Syntax validation
        run: python -m compileall -q .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: python -m mypy core crawler scanners --ignore-missing-imports

      - name: Security static scan
        run: bandit -r core scanners -iii

      - name: Tests
        run: |
          python -m pytest tests/ --strict-markers -q

      - name: Coverage
        run: |
          python -m pytest tests/ \
            --cov=crawler \
            --cov=scanners \
            --cov=core \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: "coverage-report-python-${{ matrix.python-version }}"
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m pip install --upgrade pytest pytest-asyncio pytest-cov ruff mypy bandit pyyaml hypothesis

      - name: Smoke test imports
        run: |
          python -c "import cli, core, crawler, scanners"
          python -c "from core.exceptions import PathscopeError, ScopeViolationError, FetchError"

      - name: Verify no obvious secrets in tracked files
        run: |
          if git grep --silent -n -E "AKIA[0-9A-Z]{16}"; then
            echo "Potential AWS key pattern found in tracked files"
            git grep -n -E "AKIA[0-9A-Z]{16}"
            exit 1
          fi
          if git grep --silent -n -E "FAKE-TOKEN-EXAMPLE"; then
            echo "Fake test token pattern found in tracked files"
            git grep -n -E "FAKE-TOKEN-EXAMPLE"
            exit 1
          fi
        shell: bash
